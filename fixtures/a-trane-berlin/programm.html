				"description":"<p>Pepe Berns<br /> «Old and New Friends» Gratitude<br /> 60th Birthday Celebration Concerts<br /> <span style='color: #ed1c24;'><strong>TODAY</strong></span>: TRIO BLUR &amp; YAKOU TRIBE <span style='color: #ed1c24;'><strong>SPECIAL GUESTS</strong></span>: WERNER NEUMANN &amp; CHRISTOPH ADAMS</p> <p>Der seit 1994 in Berlin lebende Bassist und Professor für Jazz Kontrabass an der Hmt Leipzig <span style='color: #ed1c24;'><strong>Pepe Berns</strong></span> kann auf eine über 40jährige Karriere zurückblicken, die ihn von Köln über LA nach NY führte. Er arbeitete mit zahllosen Größen der internationalen und lokalen Jazzwelt.<br /> <span style='color: #ed1c24;'><em><strong>Nun feiert er an zwei Abenden seinen 60. Geburtstag in seinem Lieblings-Jazz Club „A-TRANE“ und hat hierfür viele seiner engsten Freunde und Wegbegleiter aus neuester Zeit und vergangen Tagen zu sich auf die Bühne eingeladen</strong></em></span>.<br /> Den ersten Abend (25.08.) beginnt er mit seinem jüngsten Projekt, dem Trio:Blur mit den talentierten Newcomern Emmanuel Walter (p) und Lucas Rauch (dr) und der wundervollen Sängerin Sophia Günst.<br /> Im zweiten Set wird er mit seinen Freunden Jan von Klewitz (sax), Kai Brückner (git) und Rainer Winch (Dr) mit der seit 25 Jahre aktiven Band „Yakou Tribe“ spielen und hat außerdem zwei weitere Mitstreiter der ersten Stunde gewinnen können: Werner Neumann (git) und Christoph Adams (p)</p> <p>Den zweiten Abend (26.08.) widmet Berns gleich drei wichtigen Stationen seines Lebens und lädt dazu den großartigen Pianisten Sebastian Weiss (CD Berns Köbberling Weiss 2003) ein, gefolgt von seinen Hamburger Freunden der einstigen Band „Nerd Network“ (CD 1999) Gabriel Coburger (sax) Buggy Braune (p) und Heinz Lichius.<br /> Als Abschluss des Abends wird das original besetzte „Jonas Schoen Quartett“ mit den letzt genannten Musikern zu hören sein.<br /> <span style='color: #ed1c24;'><strong>Ganz bestimmt endet dieser Abend in einer fulminanten Session</strong></span>.<br /> <span style='color: #ed1c24;'><em><strong>Eine Zeitreise durch die Dekaden und Stile des Jazz, vielfältige Besetzungen und wundervolle Solisten*innen. Not to be missed!</strong></em></span></p> <p><span style='color: #282828;'>25.08.2026</span><br /> <span style='color: #282828;'>FIRST SET</span><br /> <span style='color: #282828;'>TRIO BLUR</span><br /> <span style='color: #282828;'>FEAT: Sophia Günst &#8211; Vocal</span><br /> <span style='color: #282828;'>Emmanuel Walter &#8211; Piano</span><br /> <span style='color: #282828;'>Pepe Berns &#8211; Bass</span><br /> <span style='color: #282828;'>Lucas Rauch &#8211; Drums</span></p> <p><span style='color: #282828;'>SECOND SET</span><br /> <span style='color: #282828;'>YAKOU TRIBE</span><br /> <span style='color: #282828;'>SPECIAL GUESTS: Werner Neumann / Christoph Adams</span><br /> <span style='color: #282828;'>Jan von Klewitz &#8211; Saxophone</span><br /> <span style='color: #282828;'>Kai Brückner &#8211; Guitar</span><br /> <span style='color: #282828;'>Rainer Winch &#8211; Drums</span><br /> <span style='color: #282828;'>Guests:</span><br /> <span style='color: #282828;'>Werner Neumann &#8211; Guitar</span><br /> <span style='color: #282828;'>Christoph Adams &#8211; Piano</span></p> <p><span style='color: #282828;'><strong>26.08.2026</strong></span><br /> <span style='color: #ed1c24;'><strong>FIRST SET</strong></span><br /> <span style='color: #ed1c24;'><strong>BERNS KÖBBERLING WEISS</strong></span><br /> <span style='color: #ed1c24;'><strong>Pepe Berns &#8211; Bass</strong></span><br /> <span style='color: #ed1c24;'><strong>Heinrich Köbberling &#8211; Drums</strong></span><br /> <span style='color: #ed1c24;'><strong>Sebastian Weiss &#8211; Piano</strong></span></p> <p><span style='color: #ed1c24;'><strong>SECOND SET</strong></span><br /> <span style='color: #ed1c24;'><strong>NERD NETWORK</strong></span><br /> <span style='color: #ed1c24;'><strong>Gabriel Coburger &#8211; Saxophone</stro 				"description":"<p>DESNEY BAILEY MEETS DES<br /> «Soulful House Music»<br /> <span style='color: #ed1c24;'><strong>REMIX</strong></span><br /> <span style='color: #ed1c24;'><strong>FEAT</strong></span>: Igor Zavatckii-Carmelo Leotta-Omri Abramov-Jan Trojanowski</p> <p><span style='color: #ed1c24;'><strong>DES</strong></span><br /> If you&#8217;re a fan of soulful jazzy house music, then you&#8217;re in for a real treat. Prepare to be swept away by the mesmerizing sounds of <span style='color: #ed1c24;'><strong>DES</strong></span>, a group that brings together the talents of vocalist <span style='color: #ed1c24;'><strong>Desney Bailey</strong></span> and four incredible musicians. Together, they have crafted a unique blend of jazzy harmonies and modern house grooves, creating a luxurious and soulful house vibe that will leave you wanting more. First, let&#8217;s take a closer look at the talented individuals that make up DES. Lead vocalist <span style='color: #ed1c24;'><strong>Desney Bailey</strong></span> has a voice that can only be described as pure magic. With a rich and soulful tone, she effortlessly captures the essence of the music. Her vocals have been compared to the likes of Erykah Badu and Jill Scott, and for good reason– <span style='color: #ed1c24;'><em><strong>She is a powerhouse vocalist, who knows how to captivate an audience</strong></em></span>. But Desney is not alone in this musical journey. She is backed by four incredibly talented musicians, who bring their own unique styles to the table. <span style='color: #ed1c24;'><em><strong>Together, they create a sound that is both timeless and fresh</strong></em></span>.</p> <p><span style='color: #ed1c24;'><strong>Desney Bailey</strong></span><br /> <span style='color: #ed1c24;'><strong>Desney Bailey</strong></span> is a highly regarded vocalist, who has gained recognition for her talents in Jazz, Neo Soul, and House music. Her music has traveled far, with her songs being played across Europe, the USA, South Africa, and Asia. Collaborating with renowned artists like Jazzanova, Slope, AtJazz, Laseech, Patrice Scott, 2000 Black and Oliver Marquardt, she has built an impressive discography that includes releases on top-tier labels including Sonar Kollektiv, Royal Flame Music, Flaneur Recordings, Do it Now Records, King Street Records and Luxury House, among others.</p> <p>Desney Bailey &#8211; Vocal<br /> Igor Zavatckii &#8211; Keyboards<br /> Carmelo Leotta &#8211; Bass<br /> Omri Abramov &#8211; Saxophone<br /> Jan Trojanowski &#8211; Drums</p> ","location":[{"@type":"Place","name":"A-Trane Berlin","address":{"@type": "PostalAddress","streetAddress":"Bleibtreustrasse 1 10623 "}}]}</script>
