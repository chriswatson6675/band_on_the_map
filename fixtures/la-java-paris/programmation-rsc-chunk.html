e\":\"Solar Rush : Datsko, Britney Speed, Greeds \u0026 More\",\"date\":\"2026-09-04T21:45:00.000Z\",\"type\":\"club\",\"poster\":\"/events/1787734106549-post_1080x1440-3-.png\",\"ticketUrl\":\"https://shotgun.live/fr/events/solar-rush-datsko-britney-speed-greeds-more\",\"description\":\"🔊 NEW D\u0026B SOUNDSYSTEM 🔊\\n\\nLe concept le + S O L A I R E de la région revient à la Java après un été fort en chaleur 🌼\\n\\nPour fêter la rentrée, Solar Rush invite la jeune pépite Datsko, il sera accompagné de l’étoile montante Britney Speed, ainsi que du producteur Greeds et des fêtards d’EuroNightClub aka Dj Sécurité \u0026 Dj Salle Défaite 🎎\\n\\n\\n🪆LINE -UP🪆\\n\\n•⁠  ⁠DATSKO\\n•⁠  ⁠BRITNEY SPEED\\n•⁠  ⁠GREEDS\\n•⁠  ⁠DJ SÉCURITÉ B2B DJ SALLE DÉFAITE\\n\\nOn t’attends le vendredi 04 septembre🔥\\nLet the sunshine in ☀️\"},{\"id\":\"2026-09-05-100-kendrick-lamar-party-paris\",\"name\":\"100% Kendrick Lamar Party !! (Paris)\",\"date\":\"2026-09-05T17:30:00.000Z\",\"type\":\"concert\",\"poster\":\"/events/1787740167187-saveinta.com_775244972_17904449652536069_1440304473706724679_n.jpg\",\"ticketUrl\":\"https://shotgun.live/fr/events/100-kendrick-lamar-party-paris\",\"description\":\"100% KENDRICK LAMAR PARTY IN PARIS !! 🤯🤩🇫🇷\\n\\n(Interdit aux moins 18 ans !!)\\n\\n📍Adresse : 105 Rue du Faubourg du Temple, 75010 Paris \\n🕘 Horaire : 19H30 - 23:55\\nDj : Evoox\\n\\nDress Code : Tenue iconique de Kendrick ou Hip-Hop/Streetwear \\n\\nAU PROGRAMME :\\n\\nJeux concours, prestations d’artistes \u0026 musiciens + OPEN MIC AVEC PRIX À GAGNER (toujours dans le thème 100% Kendrick Lamar) et un BIG set Dj sur du  100% Kendrick Lamar by Dj Evoox avec uniquement les sons originales ! 🪩\\n\\nUne soirée FULL 100% KENDRICK LA TEAM !! RENDEZ-VOUS COMPTE !! \\nVOUS N’ÊTES PAS PRÊTS !! PARIS VA TREMBLER  🤯\\n\\nCet événement sera filmé et photographié ! 📸 🎥\\n\\nContact : centpourcent.assistance@hotmail.com\"},{\"id\":\"2026-09-05-le-club-house-occibel-numero-6-live-bousti-more\",\"name\":\"Le Club House : Occibel, Numero 6 (Live), Bousti \u0026 More\",\"date\":\"2026-09-05T21:45:00.000Z\",\"type\":\"club\",\"poster\":\"/events/1787734276555-post-1080x1440.png\",\"ticketUrl\":\"https://shotgun.live/fr/events/le-club-house-occibel-numero-6-bousti-more\",\"description\":\"🔊 NEW D\u0026B SOUNDSYSTEM 🔊\\n\\nLe Club House, c’est une maison parisienne où chaque mur vibre au rythme des kicks. Cette fois, elle accueille OCCIBEL, BOUSTI et NUMERO 06,  trois figures de la scène house parisienne qu'on aime particulièrement. Une seule promesse : des sélections soignées et un dancefloor en mouvement. \\n\\nCome early, stay late!\\n\\n𝗟𝗶𝗻𝗲 𝘂𝗽  🔊: \\n\\nOccibel\\nhttps://www.instagram.com/occibel___/ \\n\\nBousti \\nhttps://www.instagram.com/bousti___/ \\n\\nNuméro 6 (live)\\nhttps://www.instagram.com/numero6.fr/ \\n\\nPetit Ben\\nhttps://www.instagram.com/petitben__/ \\n\\nBig Vic\\nhttps://www.instagram.com/bigvic_offpiste/ \"},{\"id\":\"2026-09-10-pop-princess-party-billie-x-zara-edition\",\"name\":\"Pop Princess Party - Billie X Zara Edition\",\"date\":\"2026-09-10T17:30:00.000Z\",\"type\":\"concert\",\"poster\":\"/events/1787740361530-saveinta.com_777396018_17885616888684255_603494284813191763_n.jpg\",\"ticketUrl\":\"https://shotgun.live/fr/events/pop-princess-party-billie-x-zara-edition-10-09-2026\",\"description\":\"$18\"},{\"id\":\"2026-09-11-pop-girlies-vs-pop-boys-festival-paris\",\"name\":\"Pop Girlies Vs Pop Boys Festival Paris\",\"date\":\"2026-09-11T17:30:00.000Z\",\"type\":\"concert\",\"poster\":\"/events/1787740432268-saveinta.com_742102274_17933794518343257_5738973502456770803_n.jpg\",\"ticketUrl\":\"https://shotgun.live/fr/events/pop-girlies-vs-pop-boys-paris\",\"description\":\"$19\"},{\"id\":\"2026-09-11-groovy-celebration-pastel-baka-g-mely-more\",\"name\":\"Groovy Celebration : Pastel, Baka G, Mely \u0026 More\",\"date\":\"2026-09-11T21:45:00.000Z\",\"type\":\"club\",\"poster\":\"/events/1787734357074-____groovy_celebration_java_11092026_post_1080x1440-1-.png\",\"ticketUrl\":\"https://shotgun.live/fr/events/groovy-celebration-pastel-baka-g-mely-radiosid\",\"description\":\"🔊 NEW D\u0026B SOUNDSYSTEM 🔊\\n\\nAprès 7 années à vous faire danser à Lyon puis dans la capitale, La Sphère prend sa retraite et laisse place à Groovy Celebration, qui devient officiellement le nom des soirées 100% Nu-Disco, House Groovy et Jackin House du collectif FALSE.\\n\\nPour fêter ça, nouvelle DA, “nouveau” nom et nouvelles ambitions ! \\n\\n\\nOn organise donc notre première soirée Groovy Celebration à la Java avec des invités de renoms, qu’on vous dévoile ici :\\n\\nPastel\\n\\nBaka G\\n\\nMely\\n\\nRadiosid\\n\\n\\nAttendez-vous à danser, à chanter, à partager une bonne dose d'amour, sans ne jamais oublier de passer un bon moment ✨\\n\\n-\\n\\n📍 La Java\\n\\n🕛 00H — 07H\\n\\n\\n▬▬▬▬▬ SUIVEZ-NOUS ▬▬▬▬▬\\n\\nhttps://www.instagram.com/groovy.celebration\"},{\"id\":\"2026-09-12-dj-angel-rin-la-dalle-succubus-more-groove-your-body\",\"name\":\"Dj Angel, Rin La Dalle, Succubus \u0026 More : Groove Your Body\",\"date\":\"2026-09-12T21:45:00.000Z\",\"type\":\"club\",\"poster\":\"/events/1787734432534-post_1080x1440.png\",\"ticketUrl\":\"https://shotgun.live/fr/events/dj-angel-rin-la-dalle-succubus-more-groove-your-body\",\"description\":\"🔊 NEW D\u0026B SOUNDSYSTEM 🔊\\n\\nNo fillers. No gimmicks.\\n\\nJust hardgroove, hypnotic techno and seven hours on the floor.\\n\\n12 September\\nLa Java\\n00—07\"},{\"id\":\"2026-09-17-boris-viande-la-jalouzie\",\"name\":\"Boris Viande + La Jalouzie\",\"date\":\"2026-09-17T18:00:00.000Z\",\"type\":\"concert\",\"poster\":\"/events/1787740586831-saveinta.com_707914075_18091991459204863_491658785326263139_n.jpg\",\"ticketUrl\":\"https://shotgun.live/fr/events/boris-viande-la-jalouzie\",\"description\":\"BORIS VIANDE - Techno romantique, fête à basse fréquence et amour en RVB !\\n\\n#DispoPourVosMariages est un spectacle électronique qui fait la part belle aux musiques traditionnelles et aux stroboscopes.\\n\\nMulti-instrumentiste et à l’initiative du label VLAD, Boris est un.e obsédé.e du tempo, possédé.e du phrasé, prêt.e à toutes les compromissions pour que la musique du monde sorte du musée.\\n\\nLA JALOUZIE - Médiéval Punk // Voix, harpe, flûtes \u0026 machines\\n\\nCompositions du XIVe siècle, kick garage, voix saturées s'exprimant en ancien Français et Anglais, La Jalouzie dépeint les émotions humaines les plus viles, dans une atmosphère punk et collante.\\n\\nQuand Sexy Sushi rencontre Hildegarde Von Bingen, quand l'aridité de l'écriture médiévale et des instruments anciens rencontre les machines, c'est La Jalouzie.\"},{\"id\":\"2026-09-18-queer-up-one-last-summer-dance-soiree-lesbienne-et-queer\",\"name\":\"Queer Up : One Last Summer Dance (Soirée Lesbienne Et Queer)\",\"date\":\"2026-09-18T17:30:00.000Z\",\"type\":\"concert\",\"poster\":\"/events/1787740651740-saveinta.com_722858425_17864721504686148_2901672839345886969_n.jpg\",\"ticketUrl\":\"https://shotgun.live/fr/events/queer-up-one-last-summer-dance-soiree-lesbienne-et-queer\",\"description\":\"$1a\"},{\"id\":\"2026-09-18-gen-006-arpl-ch4i-fanibards-more\",\"name\":\"Gen.006 : Arpl, Ch4ï, Fanibards \u0026 More\",\"date\":\"2026-09-18T21:45:00.000Z\",\"type\":\"club\",\"poster\":\"/events/1787734519035-post_1080x1440-2-.png\",\"ticketUrl\":\"https://shotgun.live/fr/events/gen-006\",\"description\":\"GEN.006 🩵 \\n\\nLe 18 septembre, GENESIS investit le club mythique parisien la Java.\\n\\nUne atmosphère énergique, un rendez-vous dédié aux pulsations de la hardtrance, aux rythmes soutenus de la hardbounce et à la puissance de la hardtechno. Rythmes martelés, grooves tranchants, basses lourdes et énergies libérées, rejoignez GENESIS lors d'un moment où les corps entrent en transe et où la cadence ne faiblit jamais.\\n\\n• ARPL\\n• CH4Ï\\n• FANIBARDS\\n• KOSMIC\\n• M4XI\\n• THYSMAD\\n\\nUne soirée, une ambiance, un public. 🌐 TECH NO LIMIT.\\n\\nPour toute question, suivez-nous sur Instagram : @00genesis_\\n\\n~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~\\nInfos pratiques :\\n\\n📍 105 rue du Faubourg du Temple, Paris 10e\\n🕛 00h à 7h\\n🚇 Métros : Goncourt, Belleville\\n🎫 Entrées gratuites avant 00h, billets disponibles sur Shotgun ou sur place\"},{\"id\":\"2026-09-19-tryangle-man-concert\",\"name\":\"Tryangle Man Concert\",\"date\":\"2026-09-19T17:30:00.000Z\",\"type\":\"concert\",\"poster\":\"/events/1787740876311-saveinta.com_762864241_18557108728075248_4410963017561686758_n.jpg\",\"ticketUrl\":\"https://shotgun.live/fr/events/tryangle-man-concert\",\"description\":\"Tryangle Man vous invite à La Java le 19 septembre pour la release party de son album, et bien plus encore.\\n\\nAu programme : un live de musique électronique signé Tryangle Man, entre groove, touches classiques et moments d'émotion, accompagné d'un deuxième acte en ouverture.\\n\\nPréparez-vous à une nuit unique en son genre, pour un véritable voyage musical.\\n\\n🕢 19h30 – 23h00\\n🎧2eme acte bientôt annoncé\\n🎶 Styles : Deep / Progressive House / Electro Jazz / Electro Swing\"},{\"id\":\"2026-09-24-johnny-makam-najma-dream\",\"name\":\"Johnny Makam + Najma Dream\",\"date\":\"2026-09-24T17:30:00.000Z\",\"type\":\"concert\",\"poster\":\"/events/1787741002703-saveinta.com_714840231_18092640572204863_4585694811281718414_n.jpg\",\"ticketUrl\":\"https://shotgun.live/fr/events/johnny-makam-najma-dream\",\"description\":\"JOHNNY MAKAM - Né à Istanbul, le groupe mêle sonorités anatoliennes, énergie rock et pulsations électroniques dans une transe moderne portée par la voix d’Ebru Aydın. Nous fêterons ensemble la sortie de leur premier album Karadeniz Dreamin’ (3 avril 2026).\\n\\nNAJMA DREAM - Un univers électro militant, un peu balkanique sur les bords, et franchement queer punk à coeur, avec une vision assumée du dancefloor : \\\"Shake your booty to shake up your minds\\\", qui se traduirait ainsi : Secouer des culs pour faire bouger les esprits\\\".\"}]}]\n"])</script>
