<script>
	$(document).ready(function(){
	    fixed_filters = $('body').hasClass('fixed-filters-navbar');
	    hideShowFilter(fixed_filters);

	    function hideShowFilter(state) {
	        if (!state) {
	            $('#open_filters').hide();
	        }
	        else {
	            $('#open_filters').show();
	        }
	    }
	    // userHasScrolled = false;
	    $(window).on('scroll',function (e) {
	        // userHasScrolled = true;
	        fixed_filters = $('body').hasClass('fixed-filters-navbar');
	        hideShowFilter(fixed_filters);
	    });
	});
</script>
