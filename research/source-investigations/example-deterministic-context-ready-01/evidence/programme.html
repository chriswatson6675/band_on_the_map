<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Example Programme — SYNTHETIC GOVERNANCE FIXTURE</title>
</head>
<body>
  <!--
    SYNTHETIC FIXTURE — this is not a real venue's website and was never
    fetched from a live source. It exists only so
    BOTM-GIG-FACT-DERIVATION-GOVERNANCE-02's tests and validator have a
    real, retained, byte-faithful HTML file demonstrating repeated context
    that is NOT restated on each individual event row — a month/year
    heading, a room/venue section heading, and a "free entry" section
    heading, each governing multiple event rows beneath it — exactly the
    real-world pattern this task exists to handle. example.org is
    reserved by IANA for documentation (RFC 2606) and is never a real
    live-music venue.
  -->
  <main>
    <h2 class="month-heading">September 2026</h2>

    <section id="sala-x" class="venue-section" data-venue-name="Sala X">
      <h3 class="section-heading">Sala X</h3>

      <section class="price-section" data-price-label="Entrada livre">
        <h4 class="price-heading">Entrada livre</h4>

        <article class="event-row" data-event-id="synthetic-contextual-concert-night-2026">
          <h2 class="event-title">Synthetic Contextual Concert Night</h2>
          <span class="event-day">17</span>
          <span class="event-time">21h (sem fuso horário indicado)</span>
          <a class="event-link" href="/programme/synthetic-contextual-concert-night-2026">Detalhes</a>
        </article>
      </section>
    </section>
  </main>
</body>
</html>
